# listen on all container interfaces; actual access is filtered by
# pg_hba.conf and by the port not being published on the host
listen_addresses = '*'
port = 5432

password_encryption = scram-sha-256

# these are the defaults but I want them explicit: a confirmed COMMIT
# must be on disk even if the box dies right after
fsync = on
synchronous_commit = on
full_page_writes = on

# modest tuning for tick ingestion
shared_buffers = 256MB
wal_buffers = 16MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9
max_connections = 50

log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %u@%d '
