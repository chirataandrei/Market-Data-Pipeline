# Access rules. Postgres uses the first matching rule, so order matters:
# anything not explicitly allowed falls through to reject.

# TYPE  DATABASE        USER            ADDRESS               METHOD

# unix socket, only reachable from inside the container
# (used by the image's init scripts and by pg_isready in the healthcheck)
local   all             all                                   trust

# the only network route in: the ingestion worker, pinned to its static
# ip on the private bridge network
host    market          ingestor        172.28.0.20/32        scram-sha-256

# everything else gets rejected
host    all             all             0.0.0.0/0             reject
host    all             all             ::/0                  reject
